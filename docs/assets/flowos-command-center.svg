      <rect x="614" y="426" width="302" height="52" rx="9" fill="#161917" stroke="#fff" stroke-opacity="0.08"/><rect x="626" y="436" width="32" height="32" rx="7" fill="#9b68e8" fill-opacity="0.12"/><circle cx="642" cy="452" r="7" fill="none" stroke="#c7a5ff"/><path d="M642 448v5l3 2" fill="none" stroke="#c7a5ff"/><text x="669" y="447" fill="#dce2de" font-size="10" font-weight="600">Recent work</text><text x="669" y="463" fill="#707873" font-size="8">Find recent project files</text><text x="899" y="457" fill="#59615c" font-size="16">›</text>
      <rect x="300" y="488" width="302" height="52" rx="9" fill="#161917" stroke="#fff" stroke-opacity="0.08"/><rect x="312" y="498" width="32" height="32" rx="7" fill="#e2a64a" fill-opacity="0.12"/><path d="M321 507h14v14h-14zM325 504h14v14" fill="none" stroke="#efc37f"/><text x="355" y="509" fill="#dce2de" font-size="10" font-weight="600">Project files</text><text x="355" y="525" fill="#707873" font-size="8">Find FlowOS project files</text><text x="585" y="519" fill="#59615c" font-size="16">›</text>
      <rect x="614" y="488" width="302" height="52" rx="9" fill="#161917" stroke="#fff" stroke-opacity="0.08"/><rect x="626" y="498" width="32" height="32" rx="7" fill="#75e6aa" fill-opacity="0.10"/><rect x="634" y="506" width="16" height="15" rx="2" fill="none" stroke="#75e6aa"/><path d="M636 518l4-4 3 3 2-2 3 3" fill="none" stroke="#75e6aa"/><text x="669" y="509" fill="#dce2de" font-size="10" font-weight="600">Images</text><text x="669" y="525" fill="#707873" font-size="8">Find Desktop images</text><text x="899" y="519" fill="#59615c" font-size="16">›</text>
    </g>
    <text x="228" y="626" fill="#79817c" font-family="monospace" font-size="8" letter-spacing="1.5">PICK UP WHERE YOU LEFT OFF</text><text x="228" y="651" fill="#e6ebe7" font-family="Arial,sans-serif" font-size="17" font-weight="600">Recent activity</text><path d="M228 667h760M228 730h760" stroke="#fff" stroke-opacity="0.075"/><text x="463" y="703" fill="#626a65" font-family="Arial,sans-serif" font-size="10">Your completed local searches will appear here.</text>
