<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">FlowOS home screen</title>
  <desc id="description">FlowOS desktop interface with a translucent sidebar, natural-language command bar, local search shortcuts, and private recent activity.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d0e15"/>
      <stop offset="0.55" stop-color="#090a10"/>
      <stop offset="1" stop-color="#0d1018"/>
    </linearGradient>
    <radialGradient id="aurora" cx="65%" cy="0%" r="70%">
      <stop stop-color="#6257b1" stop-opacity="0.22"/>
      <stop offset="0.7" stop-color="#26223f" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#090a10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sidebar" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#191a23" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#101119" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c7bcff"/>
      <stop offset="0.56" stop-color="#897be8"/>
      <stop offset="1" stop-color="#5a53a5"/>
    </linearGradient>
    <linearGradient id="command" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#282936" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#181921" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ab9aff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8e82d4" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-60%" width="160%" height="240%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5d4fc2" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1440" height="900" rx="24" fill="url(#background)"/>
  <rect x="238" width="1202" height="900" rx="24" fill="url(#aurora)"/>
  <rect width="238" height="900" rx="24" fill="url(#sidebar)"/>
  <path d="M238 0v900M238 56h1202" stroke="#fff" stroke-opacity="0.075"/>

  <g transform="translate(20 18)">
    <rect width="32" height="32" rx="10" fill="url(#mark)" filter="url(#soft-shadow)"/>
    <g fill="#fff" fill-opacity="0.88">
      <path d="M7 7h8v8H7z" rx="5"/>
      <path d="M17 7h8v8h-8z"/>
      <path d="M17 17h8v8h-8z"/>
      <path d="M7 17h8v8H7z"/>
    </g>
    <circle cx="16" cy="16" r="3" fill="#fff"/>
  </g>
  <text x="62" y="37" fill="#f3f2f7" font-family="Arial,sans-serif" font-size="15" font-weight="700">FlowOS</text>
  <text x="62" y="50" fill="#dfe1ea" fill-opacity="0.38" font-family="Arial,sans-serif" font-size="8">Personal intelligence</text>
  <rect x="181" y="26" width="37" height="17" rx="5" fill="none" stroke="#fff" stroke-opacity="0.09"/>
  <text x="188" y="38" fill="#ddd8f5" fill-opacity="0.48" font-family="Arial,sans-serif" font-size="7" font-weight="700">ALPHA</text>

  <rect x="13" y="74" width="212" height="40" rx="10" fill="#fff" fill-opacity="0.04" stroke="#fff" stroke-opacity="0.09"/>
  <circle cx="31" cy="94" r="6" fill="none" stroke="#dadce5" stroke-opacity="0.55" stroke-width="1.5"/>
  <path d="M35.5 98.5l4 4" stroke="#dadce5" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>
  <text x="49" y="98" fill="#e6e7ec" fill-opacity="0.66" font-family="Arial,sans-serif" font-size="10">Search or ask</text>
  <rect x="179" y="85" width="16" height="18" rx="5" fill="#fff" fill-opacity="0.045" stroke="#fff" stroke-opacity="0.08"/>
  <rect x="198" y="85" width="16" height="18" rx="5" fill="#fff" fill-opacity="0.045" stroke="#fff" stroke-opacity="0.08"/>
  <text x="182" y="98" fill="#e2e3ea" fill-opacity="0.48" font-family="Arial,sans-serif" font-size="9">⌘</text>
  <text x="203" y="98" fill="#e2e3ea" fill-opacity="0.48" font-family="Arial,sans-serif" font-size="8">K</text>

  <text x="22" y="153" fill="#dfe1ea" fill-opacity="0.27" font-family="Arial,sans-serif" font-size="8" font-weight="700" letter-spacing="1">WORKSPACE</text>
  <rect x="13" y="166" width="212" height="40" rx="9" fill="url(#active)" stroke="#c0b4ff" stroke-opacity="0.12"/>
  <g fill="#c0b4ff"><rect x="24" y="178" width="5" height="5" rx="1"/><rect x="32" y="178" width="5" height="5" rx="1"/><rect x="24" y="186" width="5" height="5" rx="1"/><rect x="32" y="186" width="5" height="5" rx="1"/></g>
  <rect x="223" y="177" width="2" height="19" rx="1" fill="#bdadff"/>
  <text x="48" y="191" fill="#f4f3ff" font-family="Arial,sans-serif" font-size="11" font-weight="600">Home</text>
  <circle cx="31" cy="231" r="6" fill="none" stroke="#e2e4eb" stroke-opacity="0.42" stroke-width="1.4"/><path d="M35 235l4 4" stroke="#e2e4eb" stroke-opacity="0.42"/>
  <text x="48" y="235" fill="#e3e6ed" fill-opacity="0.48" font-family="Arial,sans-serif" font-size="10">Search</text>
  <circle cx="31" cy="276" r="7" fill="none" stroke="#e2e4eb" stroke-opacity="0.42" stroke-width="1.3"/><path d="M31 272v5l3 2" fill="none" stroke="#e2e4eb" stroke-opacity="0.42"/>
  <text x="48" y="280" fill="#e3e6ed" fill-opacity="0.48" font-family="Arial,sans-serif" font-size="10">Recents</text>

  <rect x="13" y="732" width="212" height="54" rx="11" fill="#73c9a4" fill-opacity="0.04" stroke="#8fe3c1" stroke-opacity="0.11"/>
