  <rect x="18" y="674" width="188" height="50" rx="9" fill="#75e6aa" fill-opacity="0.035" stroke="#75e6aa" stroke-opacity="0.15"/><path d="M31 689l6-3 6 3v6c0 5-6 8-6 8s-6-3-6-8z" fill="none" stroke="#75e6aa"/><text x="51" y="693" fill="#c6ccc8" font-family="Arial,sans-serif" font-size="9" font-weight="600">Private by design</text><text x="51" y="708" fill="#69716c" font-family="Arial,sans-serif" font-size="8">Your files stay on this device.</text>
  <path d="M0 750h224" stroke="#fff" stroke-opacity="0.075"/><circle cx="35" cy="780" r="11" fill="#262b27"/><text x="29" y="783" fill="#cbd1cd" font-family="monospace" font-size="7">AN</text><text x="53" y="777" fill="#cbd1cd" font-family="Arial,sans-serif" font-size="9" font-weight="600">Personal workspace</text><text x="53" y="791" fill="#69716c" font-family="Arial,sans-serif" font-size="8">Local mode</text>
  <text x="252" y="35" fill="#9fa7a1" font-family="Arial,sans-serif" font-size="10" font-weight="600">Command center</text><circle cx="1306" cy="29" r="3" fill="#75e6aa"/><text x="1316" y="33" fill="#707873" font-family="monospace" font-size="8">LOCAL READY</text>
  <g transform="translate(224)">
    <path d="M485 144h20" stroke="#75e6aa"/><text x="515" y="148" fill="#7f8882" font-family="monospace" font-size="9" letter-spacing="2">YOUR DIGITAL COMMAND CENTER</text><text x="401" y="208" fill="#eef2ef" font-family="Arial,sans-serif" font-size="46" font-weight="600">What do you need</text><text x="499" y="260" fill="#b8f5d4" font-family="Arial,sans-serif" font-size="46" font-weight="600">to find?</text><text x="448" y="295" fill="#89918c" font-family="Arial,sans-serif" font-size="13">Find local files quickly, without breaking your flow.</text>
    <rect x="300" y="335" width="616" height="78" rx="13" fill="#171a18" stroke="#75e6aa" stroke-opacity="0.44" filter="url(#shadow)"/><path d="M326 358l3-9 3 9 9 3-9 3-3 9-3-9-9-3z" fill="none" stroke="#75e6aa" stroke-width="1.5"/><text x="353" y="366" fill="#737b76" font-family="Arial,sans-serif" font-size="12">Search files or enter a command...</text><rect x="866" y="347" width="37" height="37" rx="8" fill="#b8f5d4"/><path d="M885 375v-17m0 0l-7 7m7-7l7 7" fill="none" stroke="#122018" stroke-width="2" stroke-linecap="round"/><path d="M300 387h616" stroke="#fff" stroke-opacity="0.07"/><text x="318" y="402" fill="#606863" font-family="monospace" font-size="8">PRESS ENTER TO RUN</text><text x="730" y="402" fill="#606863" font-family="monospace" font-size="8">PRIVATE ON THIS DEVICE</text>
    <g font-family="Arial,sans-serif">
