      <rect width="54" height="54" rx="18" fill="#9b8eea" fill-opacity="0.08" stroke="#cbc2ff" stroke-opacity="0.13"/>
      <rect x="11" y="11" width="32" height="32" rx="10" fill="url(#mark)" filter="url(#soft-shadow)"/>
      <g fill="#fff" fill-opacity="0.88"><rect x="18" y="18" width="8" height="8"/><rect x="28" y="18" width="8" height="8"/><rect x="28" y="28" width="8" height="8"/><rect x="18" y="28" width="8" height="8"/></g>
      <circle cx="27" cy="27" r="3" fill="#fff"/>
    </g>
    <text x="510" y="211" fill="#c7c0eb" fill-opacity="0.49" font-family="Arial,sans-serif" font-size="9" font-weight="600">Your calm space to get things done</text>
    <text x="364" y="278" fill="#f5f4f8" font-family="Arial,sans-serif" font-size="48" font-weight="600" letter-spacing="-2">Everything you need,</text>
    <text x="394" y="334" fill="#bdb2ed" font-family="Arial,sans-serif" font-size="48" font-weight="600" letter-spacing="-2">one thought away.</text>
    <text x="435" y="374" fill="#dee0e8" fill-opacity="0.42" font-family="Arial,sans-serif" font-size="12">Find files and move through your work without losing focus.</text>

    <rect x="276" y="414" width="674" height="94" rx="17" fill="url(#command)" stroke="#c9bdff" stroke-opacity="0.35" filter="url(#shadow)"/>
    <path d="M308 438l3-8 3 8 8 3-8 3-3 8-3-8-8-3z" fill="none" stroke="#b8aaff" stroke-width="1.5"/>
    <text x="338" y="447" fill="#e4e5eb" fill-opacity="0.3" font-family="Arial,sans-serif" font-size="12">What would you like to find?</text>
    <rect x="899" y="427" width="38" height="38" rx="11" fill="#b8a8ff" stroke="#fff" stroke-opacity="0.28"/>
    <path d="M918 454v-16m0 0l-7 7m7-7l7 7" fill="none" stroke="#29243a" stroke-width="2" stroke-linecap="round"/>
    <path d="M276 477h674" stroke="#fff" stroke-opacity="0.06"/>
    <text x="296" y="496" fill="#dfe1ea" fill-opacity="0.27" font-family="Arial,sans-serif" font-size="8">⌘  ENTER TO SEARCH</text>
    <text x="809" y="496" fill="#dfe1ea" fill-opacity="0.27" font-family="Arial,sans-serif" font-size="8">PRIVATE AND ON-DEVICE</text>

    <g font-family="Arial,sans-serif">
      <g transform="translate(276 522)"><rect width="162" height="59" rx="13" fill="#fff" fill-opacity="0.024" stroke="#fff" stroke-opacity="0.08"/><rect x="10" y="13" width="32" height="32" rx="9" fill="#69a9f1" fill-opacity="0.1"/><text x="20" y="34" fill="#9bc7ff" font-size="16">⌕</text><text x="51" y="27" fill="#f1f1f5" fill-opacity="0.8" font-size="9" font-weight="600">Find a file</text><text x="51" y="42" fill="#dfe1ea" fill-opacity="0.27" font-size="7.5">Across this Mac</text></g>
      <g transform="translate(446 522)"><rect width="162" height="59" rx="13" fill="#fff" fill-opacity="0.024" stroke="#fff" stroke-opacity="0.08"/><rect x="10" y="13" width="32" height="32" rx="9" fill="#a78bf4" fill-opacity="0.1"/><circle cx="26" cy="29" r="7" fill="none" stroke="#c1b0ff"/><path d="M26 25v5l3 2" fill="none" stroke="#c1b0ff"/><text x="51" y="27" fill="#f1f1f5" fill-opacity="0.8" font-size="9" font-weight="600">Recent work</text><text x="51" y="42" fill="#dfe1ea" fill-opacity="0.27" font-size="7.5">Continue your flow</text></g>
      <g transform="translate(616 522)"><rect width="162" height="59" rx="13" fill="#fff" fill-opacity="0.024" stroke="#fff" stroke-opacity="0.08"/><rect x="10" y="13" width="32" height="32" rx="9" fill="#dd9e67" fill-opacity="0.1"/><path d="M20 22h12l4 4v11H20zM32 22v5h4" fill="none" stroke="#e9bc94"/><text x="51" y="27" fill="#f1f1f5" fill-opacity="0.8" font-size="9" font-weight="600">Project files</text><text x="51" y="42" fill="#dfe1ea" fill-opacity="0.27" font-size="7.5">Jump into code</text></g>
      <g transform="translate(786 522)"><rect width="164" height="59" rx="13" fill="#fff" fill-opacity="0.024" stroke="#fff" stroke-opacity="0.08"/><rect x="10" y="13" width="32" height="32" rx="9" fill="#6ccaa3" fill-opacity="0.1"/><rect x="19" y="21" width="15" height="15" rx="2" fill="none" stroke="#91daba"/><path d="M20 34l4-4 3 3 2-2 4 3" fill="none" stroke="#91daba"/><text x="51" y="27" fill="#f1f1f5" fill-opacity="0.8" font-size="9" font-weight="600">Images</text><text x="51" y="42" fill="#dfe1ea" fill-opacity="0.27" font-size="7.5">Browse visually</text></g>
    </g>

    <text x="231" y="680" fill="#c7c0eb" fill-opacity="0.49" font-family="Arial,sans-serif" font-size="9" font-weight="600">Continue</text>
    <text x="231" y="704" fill="#f5f5f7" fill-opacity="0.88" font-family="Arial,sans-serif" font-size="16" font-weight="600">Recent activity</text>
    <rect x="231" y="721" width="764" height="76" rx="14" fill="#fff" fill-opacity="0.018" stroke="#fff" stroke-opacity="0.08"/>
    <rect x="514" y="742" width="34" height="34" rx="10" fill="#fff" fill-opacity="0.025" stroke="#fff" stroke-opacity="0.08"/>
    <circle cx="531" cy="759" r="7" fill="none" stroke="#c1bbe0" stroke-opacity="0.4"/><path d="M531 755v5l3 2" fill="none" stroke="#c1bbe0" stroke-opacity="0.4"/>
    <text x="559" y="754" fill="#efeff3" fill-opacity="0.62" font-family="Arial,sans-serif" font-size="9" font-weight="600">A quiet start</text>
    <text x="559" y="770" fill="#dfe1ea" fill-opacity="0.27" font-family="Arial,sans-serif" font-size="8">Your recent searches will appear here.</text>
