  <text x="59" y="768" fill="#ccded6" fill-opacity="0.38" font-family="Arial,sans-serif" font-size="7.5">Your files never leave your device.</text>
  <path d="M13 836h212" stroke="#fff" stroke-opacity="0.075"/>
  <circle cx="34" cy="863" r="14" fill="#403c52" stroke="#fff" stroke-opacity="0.1"/>
  <text x="26" y="867" fill="#f5f4ff" fill-opacity="0.82" font-family="Arial,sans-serif" font-size="8" font-weight="600">AN</text>
  <text x="56" y="859" fill="#f1f1f5" fill-opacity="0.76" font-family="Arial,sans-serif" font-size="9" font-weight="600">Personal workspace</text>
  <text x="56" y="873" fill="#dfe1ea" fill-opacity="0.27" font-family="Arial,sans-serif" font-size="8">On-device</text>

  <text x="266" y="35" fill="#dfe1e8" fill-opacity="0.27" font-family="Arial,sans-serif" font-size="9">FlowOS</text>
  <text x="306" y="35" fill="#dfe1e8" fill-opacity="0.18" font-family="Arial,sans-serif" font-size="11">›</text>
  <text x="320" y="35" fill="#ebecef" fill-opacity="0.6" font-family="Arial,sans-serif" font-size="9" font-weight="600">Home</text>
  <rect x="1282" y="17" width="129" height="27" rx="14" fill="#fff" fill-opacity="0.025" stroke="#fff" stroke-opacity="0.06"/>
  <circle cx="1298" cy="30.5" r="3" fill="#82d5b4"/>
  <text x="1308" y="34" fill="#d1ded9" fill-opacity="0.5" font-family="Arial,sans-serif" font-size="8">Local engine ready</text>

  <g transform="translate(238)">
