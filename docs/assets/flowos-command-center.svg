<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title description">
  <title id="title">FlowOS command center</title>
  <desc id="description">Dark desktop interface with navigation, a local file search command bar, search suggestions, and an empty recent activity state.</desc>
  <defs>
    <radialGradient id="glow" cx="72%" cy="14%" r="54%"><stop offset="0" stop-color="#1c3326" stop-opacity="0.72"/><stop offset="1" stop-color="#0b0d0c" stop-opacity="0"/></radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dcffe9"/><stop offset="1" stop-color="#75e6aa"/></linearGradient>
    <filter id="shadow" x="-30%" y="-50%" width="160%" height="220%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/></filter>
  </defs>
  <rect width="1440" height="810" rx="22" fill="#0b0d0c"/><rect x="224" width="1216" height="810" fill="url(#glow)"/><rect width="224" height="810" rx="22" fill="#0e110f"/><path d="M224 0v810M224 57h1216" stroke="#fff" stroke-opacity="0.075"/>
