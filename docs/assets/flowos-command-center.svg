  <rect x="14" y="132" width="196" height="38" rx="8" fill="#1b1e1c"/><g fill="#75e6aa"><rect x="28" y="145" width="5" height="5" rx="1"/><rect x="36" y="145" width="5" height="5" rx="1"/><rect x="28" y="153" width="5" height="5" rx="1"/><rect x="36" y="153" width="5" height="5" rx="1"/></g><text x="52" y="156" fill="#e6ebe7" font-family="Arial,sans-serif" font-size="11" font-weight="600">Command center</text>
