[package]
name = "flowos"
version = "0.1.0"
description = "The local-first FlowOS desktop runtime"
authors = ["FlowOS"]
edition = "2021"

[lib]
name = "flowos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
dirs = "7"

